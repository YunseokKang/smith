# Proposed defaults. Checking this file does not schedule or send anything.
# Unknown keys are rejected, so a misspelled setting fails loudly instead of being ignored.
config_version = 1

[app]
timezone = "Asia/Seoul"
financial_access = "read_only"

[advice]
risk_preference = "growth_aggressive"   # conservative | balanced | growth | growth_aggressive (passed to the AI)
include_alternatives = true
require_macro_context = true

[privacy]
remove_personal_identifiers = true

[reports]
enabled = false
weekdays = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday"]
time = "06:00"
delivery = "gmail"
# Actual recipient and credentials belong in ignored local configuration.

# One short report a day, each on its own theme (src/smith/editions.py). A day left out here uses this
# same default plan. "monday" / "thursday" are the original full report and short change check.
[reports.editions]
monday = "overview"      # 주간 종합: 전체 그림, 이번 주 제안 요약
tuesday = "markets"      # 투자·시장: 보유 종목 의견, 투자 기준, 환율
wednesday = "property"   # 부동산: 실거래·전세, 보증금 반환, 주택 정책
thursday = "rates"       # 금리·대출: 이자 부담, 추가 상환 판단
friday = "tax"           # 세금·연금: 세액공제, 해외주식 공제, 연말정산
saturday = "life"        # 생활·목표: 현금흐름, 비상금, 목표 진행 (웹 조사 없음)

# Same-day event notes, apart from the daily editions (report design §29): a short mail when the Bank of Korea
# sets the policy rate or the listed holdings' total value (not one stock) moves more than `portfolio_move_pct`
# percent since the last check. The check
# runs at `check_time` (after the Korean close) and again right after each morning report; `run-due` does both.
[events]
enabled = true
check_time = "16:10"
portfolio_move_pct = 2.0

# The daily-routine mail (docs/daily-design.md): weather and preparations on top, the day's calendar, anniversaries,
# five news items, an encouraging line, overdue tasks. Separate from the reports, every day at `time`.
# `airways_sensitive` moves the air-quality and pollen cautions one grade earlier and keeps them on the page.
[daily]
enabled = false
time = "06:00"
news_count = 5
news_topics = ["정치", "경제", "문화", "기술", "AI"]
airways_sensitive = false

# Where the weather is read, at district precision: a district office point for the KMA grid (never a home address),
# an AirKorea station, the regional dust-forecast name, the KMA pollen area code and the words that make a warning
# relevant. Keep the real values in the local config.
# [daily.weather]
# lat = 37.5735
# lon = 126.9790
# air_station = "종로구"
# air_region = "서울"
# pollen_area_no = "1111000000"
# warning_keywords = ["서울"]
# label = "서울 종로구"                # shown in the mail as the weather's basis

# Optional, in the local config: a verified ledger copy after each sent report (see `smith backup`).
# Backups hold real financial data; prefer a drive you control, never Git or a shared cloud folder.
# [backup]
# dir = "E:/smith-backups"
# keep = 14

# Optional, in the local config: the client's retirement facts ([household]) and the complexes the household may
# move to ([targets], report design §18.3). Target deals are fetched by `smith realestate sync` like a property's;
# only `region` (city/district) ever goes into a research question, never the complex name.
# [household]
# birth_year = 1990
# retirement_monthly_spend = 5000000   # won, today's prices
# retirement_age = 60                  # payout age assumed for the pension stack (default 60)
# [targets.example]
# label = "예시 단지"
# lawd_cd = "11110"
# apt_name = "예시아파트"
# exclusive_area_m2 = 84.9
# region = "서울특별시 종로구"
# reference_price = 2500000000         # asking or sale-launch price when no trades are recorded (won)
