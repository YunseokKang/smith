name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    # Windows only: the scheduler, credential store and headless executable lookup target Windows.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      # No network, real mail or model calls: every external boundary is injected in the tests.
      - name: Test
        run: python -m unittest discover -s tests
      - name: Example config is valid
        run: python -m smith check-config --config config/smith.example.toml
