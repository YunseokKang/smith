[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smith-private-banker"
version = "0.1.0"
description = "Read-only personal wealth adviser scaffold"
requires-python = ">=3.11"
# tzdata: Windows has no system IANA time zone database; zoneinfo falls back to it.
# keyring: broker credentials live in the OS credential store, never in files or env vars.
# korean-lunar-calendar: lunar birthdays and 설·추석 converted offline with the KASI tables (FR-32).
# Pillow draws the health letter's line charts (health design §3); mail clients drop SVG, so the charts are PNG.
# cryptography + websocket-client: the card statement mail is SEED-encrypted and its page is read through a headless
# Chrome over the DevTools protocol (FR-60, docs/spending-design.md).
dependencies = ["tzdata", "keyring", "korean-lunar-calendar", "Pillow", "cryptography", "websocket-client"]

[project.scripts]
smith = "smith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Public place names for restaurant questions (FR-55), built by scripts/build_places.py.
smith = ["places_kr.txt"]
